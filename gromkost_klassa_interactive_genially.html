<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Громкость класса — интерактивная шкала</title>
<style>
  :root {
    --bg: #fffdf8;
    --ink: #0b2a57;
    --muted: #5a6f89;
    --border: #dfe7ee;
    --teal: #1595a5;
    --green: #68b85a;
    --yellow: #f4b51d;
    --coral: #f56c4e;
    --navy: #0b2a57;
    --shadow: 0 10px 30px rgba(12,42,87,.10);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .board {
    width: min(1280px, 100%);
    aspect-ratio: 16 / 9;
    min-height: 560px;
    background: var(--bg);
    border: 3px solid var(--navy);
    border-radius: 26px;
    box-shadow: var(--shadow);
    padding: clamp(18px, 2vw, 32px);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 18px;
    overflow: hidden;
    position: relative;
  }

  .header {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 18px;
  }

  .title-wrap h1 {
    margin: 0;
    font-size: clamp(34px, 4.2vw, 62px);
    line-height: .95;
    letter-spacing: .02em;
    font-weight: 900;
  }

  .title-wrap p {
    margin: 8px 0 0;
    font-size: clamp(16px, 1.6vw, 24px);
    color: var(--teal);
    font-weight: 700;
  }

  .status {
    text-align: right;
    min-width: 240px;
  }

  .status .label {
    font-size: clamp(13px, 1.1vw, 16px);
    color: var(--muted);
    margin-bottom: 4px;
  }

  .status .value {
    font-size: clamp(22px, 2vw, 30px);
    font-weight: 900;
  }

  .scale-wrap {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 230px;
    gap: 28px;
    min-height: 0;
  }

  .levels {
    display: grid;
    grid-template-rows: repeat(5, 1fr);
    gap: 10px;
    min-height: 0;
  }

  .level {
    width: 100%;
    border: 2px solid var(--level-color);
    border-radius: 18px;
    background: rgba(255,255,255,.72);
    display: grid;
    grid-template-columns: 96px 1fr 130px;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    color: var(--ink);
    cursor: pointer;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    text-align: left;
  }

  .level:hover {
    background: rgba(255,255,255,.95);
  }

  .level.selected {
    background: color-mix(in srgb, var(--level-color) 13%, white);
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--level-color) 45%, white);
  }

  .num {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    background: var(--level-color);
    color: white;
    display: grid;
    place-items: center;
    font-size: 46px;
    font-weight: 900;
  }

  .copy strong {
    display: block;
    color: var(--level-color);
    font-size: clamp(22px, 2vw, 30px);
    line-height: 1;
    letter-spacing: .02em;
  }

  .copy span {
    display: block;
    margin-top: 5px;
    font-size: clamp(15px, 1.35vw, 20px);
    font-weight: 700;
  }

  .icon {
    justify-self: end;
    width: 72px;
    height: 72px;
    border: 2px solid var(--level-color);
    border-radius: 50%;
    color: var(--level-color);
    display: grid;
    place-items: center;
    font-size: 34px;
    font-weight: 800;
  }

  .pointer-rail {
    position: relative;
    border-left: 2px dashed #c7d3df;
    min-height: 0;
  }

  .pointer {
    position: absolute;
    left: 18px;
    top: 0;
    width: 190px;
    height: 74px;
    border-radius: 16px 8px 8px 16px;
    background: var(--navy);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 23px;
    font-weight: 900;
    letter-spacing: .02em;
    cursor: grab;
    user-select: none;
    touch-action: none;
    transition: transform .22s ease, background .18s ease;
    box-shadow: 0 6px 16px rgba(12,42,87,.18);
  }

  .pointer::before {
    content: "";
    position: absolute;
    left: -26px;
    top: 18px;
    border-top: 19px solid transparent;
    border-bottom: 19px solid transparent;
    border-right: 28px solid var(--navy);
  }

  .pointer.dragging {
    cursor: grabbing;
    transition: none;
  }

  .pointer .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: currentColor;
    opacity: .8;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: var(--muted);
    font-size: clamp(13px, 1.2vw, 17px);
  }

  .hint {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .keys {
    display: flex;
    gap: 6px;
  }

  .key {
    min-width: 28px;
    height: 28px;
    padding: 0 7px;
    border: 1px solid #cfd9e2;
    border-radius: 7px;
    background: white;
    display: grid;
    place-items: center;
    color: var(--ink);
    font-weight: 800;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: .78;
  }

  .brand img {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }

  .brand span {
    font-size: 13px;
    font-weight: 700;
  }

  @media (max-width: 760px) {
    body { padding: 6px; }
    .board {
      aspect-ratio: auto;
      min-height: 780px;
      border-radius: 18px;
      padding: 16px;
    }
    .header {
      align-items: start;
      flex-direction: column;
    }
    .status {
      text-align: left;
      min-width: 0;
    }
    .scale-wrap {
      grid-template-columns: 1fr;
      padding-right: 0;
    }
    .pointer-rail {
      position: absolute;
      inset: 0 0 0 auto;
      width: 98px;
      border-left: 0;
      pointer-events: none;
    }
    .pointer {
      width: 92px;
      height: 54px;
      left: 0;
      font-size: 14px;
      pointer-events: auto;
    }
    .pointer::before {
      left: -18px;
      top: 13px;
      border-top-width: 14px;
      border-bottom-width: 14px;
      border-right-width: 20px;
    }
    .level {
      grid-template-columns: 72px 1fr;
      padding-right: 105px;
    }
    .num {
      width: 58px;
      height: 58px;
      font-size: 34px;
    }
    .icon { display: none; }
    .footer {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
</head>
<body>
<main class="board" id="board" aria-label="Интерактивная шкала громкости класса">
  <header class="header">
    <div class="title-wrap">
      <h1>ГРОМКОСТЬ КЛАССА</h1>
      <p>Как мы работаем сейчас?</p>
    </div>
    <div class="status" aria-live="polite">
      <div class="label">Текущий режим</div>
      <div class="value" id="statusValue">0 · ТИШИНА</div>
    </div>
  </header>

  <section class="scale-wrap" id="scaleWrap">
    <div class="levels" id="levels">
      <button class="level selected" data-level="0" style="--level-color:#0b2a57" type="button">
        <div class="num">0</div>
        <div class="copy"><strong>ТИШИНА</strong><span>Работаем молча</span></div>
        <div class="icon" aria-hidden="true">×</div>
      </button>

      <button class="level" data-level="1" style="--level-color:#1595a5" type="button">
        <div class="num">1</div>
        <div class="copy"><strong>ШЁПОТ</strong><span>Слышит только сосед</span></div>
        <div class="icon" aria-hidden="true">)))</div>
      </button>

      <button class="level" data-level="2" style="--level-color:#68b85a" type="button">
        <div class="num">2</div>
        <div class="copy"><strong>РАЗГОВОР</strong><span>Работаем в паре или группе</span></div>
        <div class="icon" aria-hidden="true">••</div>
      </button>

      <button class="level" data-level="3" style="--level-color:#f4b51d" type="button">
        <div class="num">3</div>
        <div class="copy"><strong>ДЛЯ ВСЕХ</strong><span>Говорит один, слышит весь класс</span></div>
        <div class="icon" aria-hidden="true">!</div>
      </button>

      <button class="level" data-level="4" style="--level-color:#f56c4e" type="button">
        <div class="num">4</div>
        <div class="copy"><strong>СВОБОДНО</strong><span>Можно общаться свободно</span></div>
        <div class="icon" aria-hidden="true">•••</div>
      </button>
    </div>

    <div class="pointer-rail" id="rail" aria-label="Подвижный указатель">
      <div class="pointer" id="pointer" role="slider" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" aria-label="Текущий уровень громкости">
        <span class="dot"></span>
        СЕЙЧАС
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="hint">
      <span>Нажмите уровень или клавишу:</span>
      <div class="keys" aria-hidden="true">
        <span class="key">0</span><span class="key">1</span><span class="key">2</span><span class="key">3</span><span class="key">4</span>
      </div>
    </div>

<script>
(() => {
  const levels = [...document.querySelectorAll('.level')];
  const pointer = document.getElementById('pointer');
  const rail = document.getElementById('rail');
  const statusValue = document.getElementById('statusValue');

  const names = ['ТИШИНА','ШЁПОТ','РАЗГОВОР','ДЛЯ ВСЕХ','СВОБОДНО'];
  const colors = ['#0b2a57','#1595a5','#68b85a','#f4b51d','#f56c4e'];
  let current = 0;
  let dragging = false;

  function moveTo(level, animate = true) {
    current = Math.max(0, Math.min(4, Number(level)));
    levels.forEach((el, i) => el.classList.toggle('selected', i === current));

    const target = levels[current];
    const railRect = rail.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();
    const pointerRect = pointer.getBoundingClientRect();
    const y = targetRect.top - railRect.top + (targetRect.height - pointerRect.height) / 2;

    pointer.style.transition = animate ? 'transform .22s ease, background .18s ease' : 'none';
    pointer.style.transform = `translateY(${y}px)`;
    pointer.style.background = colors[current];
    pointer.style.setProperty('--navy', colors[current]);
    pointer.setAttribute('aria-valuenow', current);
    statusValue.textContent = `${current} · ${names[current]}`;
  }

  levels.forEach(el => {
    el.addEventListener('click', () => moveTo(el.dataset.level));
  });

  window.addEventListener('keydown', (e) => {
    if (/^[0-4]$/.test(e.key)) moveTo(Number(e.key));
    if (e.key === 'ArrowUp') moveTo(current - 1);
    if (e.key === 'ArrowDown') moveTo(current + 1);
  });

  pointer.addEventListener('pointerdown', (e) => {
    dragging = true;
    pointer.classList.add('dragging');
    pointer.setPointerCapture(e.pointerId);
  });

  pointer.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const centers = levels.map(el => {
      const r = el.getBoundingClientRect();
      return r.top + r.height / 2;
    });
    let nearest = 0;
    let best = Infinity;
    centers.forEach((c, i) => {
      const d = Math.abs(e.clientY - c);
      if (d < best) { best = d; nearest = i; }
    });
    moveTo(nearest, false);
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    pointer.classList.remove('dragging');
    moveTo(current, true);
  }

  pointer.addEventListener('pointerup', endDrag);
  pointer.addEventListener('pointercancel', endDrag);

  window.addEventListener('resize', () => moveTo(current, false));
  window.addEventListener('load', () => moveTo(0, false));
})();
</script>
